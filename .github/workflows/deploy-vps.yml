name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: applyron-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: ${{ vars.APP_NAME }}
  ALLOWED_DEPLOY_ACTORS: ${{ vars.ALLOWED_DEPLOY_ACTORS }}
  SSH_PORT: ${{ vars.SSH_PORT || '22' }}
  REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
  REMOTE_STACK_DIR: ${{ vars.REMOTE_STACK_DIR }}
  REMOTE_ENV_FILE: ${{ vars.REMOTE_ENV_FILE }}
  HEALTHCHECK_TIMEOUT: ${{ vars.HEALTHCHECK_TIMEOUT || '120' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST_ED25519_FINGERPRINT: ${{ vars.DEPLOY_HOST_ED25519_FINGERPRINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Write release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import socket
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          def sanitize_repo_url(value: str) -> str:
              if not value:
                  return ""
              try:
                  parts = urlsplit(value)
              except Exception:
                  return value
              if parts.scheme in {"http", "https", "ssh"} and "@" in parts.netloc:
                  return urlunsplit((parts.scheme, parts.netloc.rsplit("@", 1)[1], parts.path, parts.query, parts.fragment))
              return value

          manifest = {
              "schema_version": "1",
              "app": os.environ.get("APP_NAME", "applyron-portfolio"),
              "repo_url": sanitize_repo_url(f"https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}.git"),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "dirty": False,
              "release_id": "",
              "deployed_at_utc": "",
              "deploy_method": "github-actions",
              "source_host": os.environ.get("RUNNER_NAME") or socket.gethostname(),
              "compose_file": f"{os.environ.get('REMOTE_STACK_DIR', '')}/compose.yaml",
          }
          Path(".applyron-release.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            APP_NAME
            REMOTE_APP_DIR
            REMOTE_STACK_DIR
            REMOTE_ENV_FILE
            DEPLOY_HOST
            DEPLOY_USER
            DEPLOY_HOST_ED25519_FINGERPRINT
          )

          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "${key} is required. Configure it via repository variables or secrets."
              exit 1
            fi
          done

      - name: Validate deploy actor
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ALLOWED_DEPLOY_ACTORS}" ]; then
            echo "ALLOWED_DEPLOY_ACTORS is not set. Skipping actor allowlist check."
            exit 0
          fi

          actor_allowed="false"
          IFS=',' read -ra actors <<< "${ALLOWED_DEPLOY_ACTORS}"
          for actor in "${actors[@]}"; do
            actor="$(echo "$actor" | xargs)"
            if [ "$actor" = "${GITHUB_ACTOR}" ]; then
              actor_allowed="true"
              break
            fi
          done

          if [ "$actor_allowed" != "true" ]; then
            echo "Actor ${GITHUB_ACTOR} is not allowed to deploy ${APP_NAME}."
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Verify and trust deploy host key
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_HOST_ED25519_FINGERPRINT}" ]; then
            echo "DEPLOY_HOST_ED25519_FINGERPRINT is required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -p "${SSH_PORT}" -t ed25519 "${DEPLOY_HOST}" > /tmp/deploy_host_ed25519.pub

          if [ ! -s /tmp/deploy_host_ed25519.pub ]; then
            echo "Failed to read deploy host ed25519 key."
            exit 1
          fi

          scanned_fingerprint="$(ssh-keygen -lf /tmp/deploy_host_ed25519.pub -E sha256 | awk 'NR==1 {print $2}')"

          if [ "${scanned_fingerprint}" != "${DEPLOY_HOST_ED25519_FINGERPRINT}" ]; then
            echo "Deploy host fingerprint mismatch."
            echo "Expected: ${DEPLOY_HOST_ED25519_FINGERPRINT}"
            echo "Actual:   ${scanned_fingerprint}"
            exit 1
          fi

          cat /tmp/deploy_host_ed25519.pub >> ~/.ssh/known_hosts

      - name: Ensure remote repo directory
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${REMOTE_APP_DIR}/repo'"

      - name: Sync repository
        run: |
          set -euo pipefail
          REMOTE_DIR="${REMOTE_APP_DIR}/repo"
          rsync -az --delete \
            -e "ssh -p ${SSH_PORT}" \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            --exclude ".playwright-cli" \
            --exclude ".local" \
            --exclude "output" \
            --exclude "coverage" \
            --exclude "tsconfig.tsbuildinfo" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

      - name: Deploy release through Dockge stack
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "APP_NAME='${APP_NAME}' REMOTE_APP_DIR='${REMOTE_APP_DIR}' REMOTE_STACK_DIR='${REMOTE_STACK_DIR}' REMOTE_ENV_FILE='${REMOTE_ENV_FILE}' HEALTHCHECK_TIMEOUT='${HEALTHCHECK_TIMEOUT}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="${REMOTE_APP_DIR}"
          REPO_DIR="${APP_DIR}/repo"
          RELEASES_DIR="${APP_DIR}/releases"
          CURRENT_LINK="${APP_DIR}/current"
          PREVIOUS_LINK="${APP_DIR}/previous"
          APP_ENV_FILE="${REMOTE_ENV_FILE}"
          STACK_DIR="${REMOTE_STACK_DIR}"
          STACK_COMPOSE="${STACK_DIR}/compose.yaml"
          LOG_FILE="${APP_DIR}/shared/deploy.log"
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)"
          RELEASE_DIR="${RELEASES_DIR}/${RELEASE_ID}"
          PREV_TARGET=""
          CUTOVER_STARTED="false"

          rollback() {
            if [[ -z "${PREV_TARGET}" ]]; then
              echo "Rollback skipped: previous release is not available." >&2
              return 1
            fi

            ln -sfn "${PREV_TARGET}" "${CURRENT_LINK}"
            docker compose --project-name "${APP_NAME}" -f "${STACK_COMPOSE}" up -d --build --remove-orphans
          }

          rollback_on_error() {
            if [[ "${CUTOVER_STARTED}" = "true" ]]; then
              echo "Deploy failed after cutover. Rolling back ${APP_NAME}." >&2
              rollback || true
            fi
          }

          trap rollback_on_error ERR

          if [[ ! -d "${REPO_DIR}" ]]; then
            echo "Missing repo directory: ${REPO_DIR}" >&2
            exit 1
          fi

          if [[ ! -f "${REPO_DIR}/package.json" || ! -f "${REPO_DIR}/package-lock.json" ]]; then
            echo "Repository sync is incomplete in ${REPO_DIR}." >&2
            exit 1
          fi

          if [[ ! -f "${APP_ENV_FILE}" ]]; then
            echo "Missing app environment file: ${APP_ENV_FILE}" >&2
            exit 1
          fi

          if [[ ! -f "${STACK_COMPOSE}" ]]; then
            echo "Missing Dockge stack file: ${STACK_COMPOSE}" >&2
            exit 1
          fi

          mkdir -p "${RELEASE_DIR}" "$(dirname "${LOG_FILE}")"

          {
            echo "[$(date -u +%FT%TZ)] Starting deploy for ${APP_NAME}"

            rsync -az --delete \
              --exclude ".git" \
              --exclude "node_modules" \
              --exclude ".next" \
              --exclude ".playwright-cli" \
              --exclude ".local" \
              --exclude "output" \
              --exclude "coverage" \
              --exclude "tsconfig.tsbuildinfo" \
              "${REPO_DIR}/" "${RELEASE_DIR}/"

            ln -sfn "${APP_ENV_FILE}" "${RELEASE_DIR}/.env.production"

            if [[ -L "${CURRENT_LINK}" ]]; then
              PREV_TARGET="$(readlink -f "${CURRENT_LINK}")"
              ln -sfn "${PREV_TARGET}" "${PREVIOUS_LINK}"
            fi

            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}"
            CUTOVER_STARTED="true"

            set -a
            source "${APP_ENV_FILE}"
            set +a

            docker compose --project-name "${APP_NAME}" -f "${STACK_COMPOSE}" config -q
            docker compose --project-name "${APP_NAME}" -f "${STACK_COMPOSE}" up -d --build --remove-orphans

            HEALTH_URL="http://127.0.0.1:${APP_PORT}/api/health"
            deadline=$((SECONDS + HEALTHCHECK_TIMEOUT))

            until curl -fsS "${HEALTH_URL}" >/dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "Healthcheck failed for ${APP_NAME} at ${HEALTH_URL}" >&2
                rollback
                CUTOVER_STARTED="false"
                exit 1
              fi
              sleep 5
            done

            echo "[$(date -u +%FT%TZ)] Deploy completed for ${APP_NAME}"
            CUTOVER_STARTED="false"
            trap - ERR
          } | tee -a "${LOG_FILE}"
          REMOTE_SCRIPT
